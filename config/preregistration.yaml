# AEM base-rate study – pre-registration (DRAFT)
#
# How the lock works
#   * Everything below this comment block is hashed (SHA-256 of the parsed YAML,
#     canonical JSON). Comments and key order do not change the hash; any value does.
#   * Review and edit freely while status is "draft". When you are satisfied, set
#     study.status to "final" and lock (config/LOCK.json). The outcome engine
#     refuses to run until the lock exists and matches this file.
#   * Changing anything after the lock is an amendment: it needs a deliberate
#     re-lock with a note, and the previous lock stays in LOCK.json's history.
#   * review_before_lock lists the decisions still open. The lock refuses while the
#     list has entries: settle each one in the config, then delete it from the list.

study:
  id: aem-basestudy
  title: "Base rates for extreme multiples in US small caps, and the information content of AEM screening signals"
  version: "0.2"
  status: draft
  author: "Felix D. Langer"
  framework: "AEM-2 v2.6 (the screening terminal's default since Oct 25, 2026)"

decisions:
  # Settled with Felix on Nov 6, 2026 (Bangkok). Kept in the hashed record for the
  # paper's methods section.
  - id: D1
    topic: delisting returns
    decision: >-
      Checked against the sources: -30% for performance-related delistings on NYSE and
      NYSE American (Shumway 1997) and -55% on Nasdaq (Shumway and Warther 1999),
      applied only when the actual delisting return is unknown, which is always the
      case here. Mergers take 0%.
  - id: D2
    topic: sample start
    decision: >-
      First formation date January 2013, not 2003 (AEM-2 v2.6) or 2009 (draft 0.1).
      Smaller companies tagged XBRL financial statements only for periods ending on or
      after June 15, 2011, so trailing free cash flow, net cash and year-on-year growth
      are known from filings for every company size and fiscal-year pattern from
      January 2013. Earlier years are skipped rather than filled from other sources.
      All hypotheses use the same sample, so the prior and the likelihood ratios
      describe the same population.
  - id: D3
    topic: formation frequency
    status: proposed by Claude on Nov 6, 2026 – open for Felix's review
    decision: >-
      Quarterly formation dates (the first trading day of January, April, July and
      October) instead of year-end only. The AEM applies its prior on any date, so the
      base rate should average over the calendar, and a January-only screen mixes the
      turnaround cohort with the turn-of-year rebound of tax-loss losers. The January
      subset is reported as the like-for-like AEM-2 v2.6 year-end design.
  - id: D4
    topic: universe floor
    decision: Market cap from US$100m to US$2bn, as in AEM-2 v2.6.
  - id: D5
    topic: signals
    decision: >-
      H4 tests the AEM-2 v2.6 battery: an S1 proxy, S4 proxies (any purchase, a
      cluster, opportunistic insiders), the floor (net cash), positive free cash flow,
      low dilution and low attention. Analyst counts need I/B/E/S, which is paid, so
      attention is measured by institutional breadth from SEC Form 13F filings, with
      share turnover as the fallback.
  - id: D6
    topic: insider purchases
    decision: >-
      Both definitions, compared: any officer or director purchase (combined) and
      purchases by opportunistic insiders only (Cohen, Malloy and Pomorski 2012), with
      routine and unclassified insiders reported separately.

review_before_lock:
  - >-
    D3: confirm quarterly formation dates (proposed Nov 6, 2026), or revert to January
    only.
  - >-
    Run Phase F of the notebook once (counts only, no returns) and check that each
    feature is known for at least 80% of universe windows from its first formation
    date, and that fewer than 25% of ended series fall into the "unknown" delisting
    class. If a check fails, fix the definition here before locking.

hypotheses:
  - id: H1
    tier: primary
    type: descriptive
    statement: >-
      Base rates. The probability that a US small cap's price touches m times its
      entry price within T years, for m in {3, 10} and T in {3, 5}, and the
      distribution of five-year end multiples on the six-bucket grid with its mean.
      Reported pooled, by start year, and by regime (start dates before 2022 versus
      2022 and later).
  - id: H2
    tier: primary
    type: confirmatory
    statement: >-
      Fallen-quality cohort (the terminal's turnaround lane). Stocks at least 40% below
      their 3-year high, with positive trailing-twelve-month free cash flow, net cash,
      and an open-market purchase (Form 4 code P) by an officer or director filed in
      the prior 6 months touch 3x within 3 years more often than the unconditional
      base rate (likelihood ratio > 1).
    variants:
      H2a: any officer or director purchase (the combined definition)
      H2b: purchases by opportunistic insiders only (Cohen, Malloy and Pomorski 2012)
    comparison: >-
      H2c (secondary). Within the cohort, windows with an opportunistic purchase versus
      windows with routine purchases only: the difference in 3x touch rates and in
      likelihood ratios, with 95% intervals. Unclassified insiders are reported as a
      third group. This shows whether separating insider types adds information beyond
      the combined definition.
    ablation: >-
      Drop each cohort condition in turn and report each condition's marginal
      likelihood ratio, to show which condition carries the information.
  - id: H3
    tier: secondary
    type: confirmatory
    statement: >-
      Horizon conversion. P(touch >= 3x within 3 years) equals P(touch >= 6.24x within
      5 years), where 6.24 = 3^(5/3) is the AEM Matrix's annualized-rate mapping.
      The mapping is rejected if the ratio of the two probabilities differs from 1 at
      the 5% level.
  - id: H4
    tier: secondary
    type: confirmatory
    statement: >-
      Signal likelihood ratios. Each AEM-2 v2.6 signal proxy carries a likelihood ratio
      above 1 for touching 10x within 5 years, out of sample (fit on start dates up to
      2016, test on 2017 to 2021): S1 (free cash flow per share outgrew revenue), S4
      any (an officer or director purchase), S4 cluster (two or more insiders), S4
      opportunistic, floor (net cash), positive free cash flow, low dilution, and low
      attention.
    benchmark: >-
      Out of sample, the fitted 10x model (M2) is compared with a unit-weighted
      checklist of the same signals and with the base rate alone, by Brier score. If M2
      does not beat the checklist, the checklist is what the terminal uses.
  - id: H5
    tier: exploratory
    type: exploratory
    statement: >-
      Regime. Base rates and likelihood ratios differ between start dates before 2022
      and 2022 or later. Low power by construction; reported as exploratory only.
  - id: H6
    tier: exploratory
    type: exploratory
    statement: >-
      Post-results clusters. Two or more officer or director purchases within 14 days
      after a 10-Q or 10-K filing (the AEM-2 v2.6 S4 flag; the filing date stands in for
      the results date) carry a higher likelihood ratio for touching 3x within 3 years
      than other purchases.

analysis_hierarchy: >-
  H1 and H2 (H2a and H2b, Holm-corrected) are primary and are the only results that
  may be stated as findings. H2c, H3 and H4 are secondary and are reported as
  supporting evidence. H5 and H6 are exploratory and are reported as hypotheses for
  future work.

universe:
  country: US
  exchanges: [NYSE, NASDAQ, NYSE American]
  security_type: common stock
  filer: >-
    Files 10-K and 10-Q reports with XBRL financial statements (SEC Financial Statement
    Data Sets), with one filed within current_filer_months before the formation date.
  exclude: [ETF, closed-end fund, pre-merger SPAC shell (SIC 6770), ADR and other foreign private issuers (20-F or 40-F filers)]
  min_price_usd: 1.0
  market_cap_usd: {min: 100000000, max: 2000000000}     # AEM-2 v2.6
  market_cap: >-
    Unadjusted entry price times shares outstanding from the latest cover page filed
    before the formation date (dei:EntityCommonStockSharesOutstanding, summed across
    classes); SimFin shares where no filing value exists.
  unadjusted_price: >-
    Vendor price histories are rescaled for every later split, so size and price filters
    on them would use the future (a later 1:10 reverse split shows ten times the actual
    price). The unadjusted entry price is the vendor's adjusted price times the ratio of
    the 13F implied price (market value over shares held, median of at least three
    filers) to the vendor's price at the latest usable quarter-end; without 13F holders,
    the vendor's own close. The minimum price uses the same basis.
  min_median_dollar_volume_20d_usd: 100000
  current_filer_months: 15

starts:
  frequency: quarterly
  months: [1, 4, 7, 10]        # formation on the first trading day of each
  years: [2013, 2023]          # inclusive; windows that end after the data's as-of date are censored
  entry_tolerance_days: 7      # entry = first close on or after the start date, within this many days
  annual_subset_month: 1       # January formations reproduce the AEM-2 v2.6 year-end design

price_panel:
  sources: >-
    SimFin cache first; Stooq for symbols SimFin lacks; EODHD only if the coverage
    audit recommends it. One source per symbol, never mixed inside a series.
  as_of: >-
    The earliest of the sources' last dates, so a source that ends sooner never looks
    like a wave of delistings.

outcomes:
  horizons_years: [3, 5, 10]
  touch_multiples: [2, 3, 4, 6.24, 10, 100]
  touch_basis: daily closes on the panel series (SimFin adjusted close, else close; Stooq close), never intraday highs
  end_basis: adjusted close where available, else close
  stale_gap_days: 30           # a series that stops more than this before the window end has ended
  max_gap_days: 120            # a gap this long inside a series ends it (symbol reuse, relisting)
  censoring: exclude windows that end after the data as-of date
  # Six-bucket grid from AEM-2 v2.5. Edges are geometric midpoints between grid
  # values; each bucket includes its lower edge.
  bucket_edges: [0.2, 0.632, 1.58, 3.54, 7.07]
  bucket_labels: [0.1, 0.4, 1.0, 2.5, 5.0, 10.0]

delisting:
  # Returns applied to the last observed price when a series ends inside a window.
  returns:
    merger: 0.0
    performance_nyse_amex: -0.30
    performance_nasdaq: -0.55
    performance: -0.30           # performance-related, exchange unknown
    unknown: -0.30
  sources: >-
    Shumway, T. (1997). The delisting bias in CRSP data. Journal of Finance, 52(1),
    327-340. Shumway, T., and Warther, V. A. (1999). The delisting bias in CRSP's
    Nasdaq data and its implications for the size effect. Journal of Finance, 54(6),
    2361-2379; its abstract: "a corrected return of -55 percent for missing
    performance-related delisting returns corrects the bias". The 1997 full text was
    not reachable, so the -30% NYSE/AMEX figure is checked against Alquist, R., Israel,
    R., and Moskowitz, T. (2018). Fact, fiction, and the size effect. Journal of
    Portfolio Management, 45(1), note 6. Imputing only when the delisting return is
    missing is the standard implementation (SAFE data center, CRSP data description).
  classification:
    merger: >-
      A merger filing about the issuer (DEFM14A, DEFM14C, PREM14A, PREM14C, SC 14D9,
      SC TO-T, SC 13E3 or 425) in the 365 days before its last trading day or the 30
      days after.
    performance: >-
      No merger evidence, and the last close is below US$1, or at most half the close a
      year earlier, or the exchange filed Form 25-NSE.
    exchange: >-
      The exchange named on Form 25-NSE, else the listing folder in the Stooq file. NYSE
      and NYSE American (formerly NYSE MKT and AMEX) take performance_nyse_amex, Nasdaq
      takes performance_nasdaq, an unknown exchange takes performance.
    unknown: Neither kind of evidence.
  bounds: >-
    Every imputed delisting is also reported with a lower bound (total loss of the last
    price) and an upper bound (no haircut on the last price).

turnaround_cohort:
  name: fallen quality (the terminal's turnaround lane)
  drawdown_from_high: -0.40
  drawdown_lookback_years: 3
  drawdown_variants: [absolute, relative_to_market]   # absolute is primary; relative subtracts the universe median drawdown on the same date
  ttm_free_cash_flow_positive: true
  net_cash_positive: true
  insider_purchase:
    form: "4"
    transaction_code: P
    acquired_disposed: A
    roles: [officer, director]
    lookback_months: 6
    availability: Form 4 filing date
    exclude_rule_10b5_1: true        # where the filing carries the Rule 10b5-1 flag
    cluster_variant_min_insiders: 2
    classification:
      method: Cohen, Malloy and Pomorski (2012), Journal of Finance, 67(3), 1009-1043
      routine: >-
        Traded (open-market purchases and sales pooled) in the same calendar month in
        each of the three calendar years before the formation year.
      opportunistic: Traded in each of those three years, but not routine.
      unclassified: Fewer than three consecutive years of trades.
      unit: insider and issuer pair, classified on January 1 from trades filed before it
      robustness: purchases only

features:
  availability: >-
    Each value is used only from the date it became public: a financial value from its
    10-K or 10-Q filing date, an insider trade from its Form 4 filing date, a 13F
    holding from its 13F filing date. The look-ahead guard fails the run otherwise.
  first_formation_date: {H1: "2013-01", H2: "2013-01", H4: "2013-07"}   # H4 waits for 13F breadth (XML filings from May 2013)
  ttm: >-
    Flows (operating cash flow, capital expenditure, revenue): the annual value at the
    latest period, or the prior fiscal year plus the current year-to-date less the
    prior year-to-date, using for each period the latest value filed before the
    formation date.
  free_cash_flow: >-
    NetCashProvidedByUsedInOperatingActivities less
    PaymentsToAcquirePropertyPlantAndEquipment (fallback tags in the code). Missing
    capital expenditure counts as zero and is flagged.
  net_cash: cash and equivalents plus short-term investments less debt, at the latest balance-sheet date
  dilution: >-
    Change in weighted-average diluted shares against the same period a year earlier;
    low dilution means below 2%.
  s1_proxy: free cash flow per share positive now and a year earlier, and growing faster than revenue
  missing: >-
    H2 and H4 use the windows whose inputs are all known at the start date; the share
    left out is reported. A company with no Form 4 purchase on file counts as having
    none (insiders must file), not as unknown.
  attention:
    primary: >-
      Institutional breadth: the number of 13F filers with a share position in the
      stock for the latest quarter, counting filings filed before the formation date.
    fallback: turnover – median daily volume over shares outstanding, prior 126 trading days
    low: bottom tercile of the measure net of log market cap, per formation date
    cusip_bridge: SimFin ISIN (a US ISIN carries the CUSIP), then the normalized issuer name
    rule: >-
      Breadth is the H4 attention signal if it is known for at least 80% of H4
      windows; otherwise turnover is, and breadth is reported as exploratory. Decided
      on counts before the lock.
  post_results_window_days: 14   # H6

estimation:
  # How each hypothesis is tested, fixed before any outcome is seen. Follows the AEM-2
  # v2.6 calibration test battery: an ordered logit on the six buckets, a 10x logit,
  # start-date fixed effects, firm-clustered errors, an out-of-sample split, robustness.
  unit: one window per firm, formation date and horizon
  likelihood_ratio: >-
    LR = P(signal | hit) / P(signal | miss), the factor the AEM posterior applies to the
    prior odds. LR > 1 says the same as a hit rate above the base rate.
  intervals: >-
    95% intervals from a firm-cluster bootstrap: all of a firm's windows are resampled
    together, because one firm appears in several overlapping start dates. Pooled H1
    rates are also shown with start years resampled (blocks of four quarterly dates),
    which reflects market-wide shocks.
  bootstrap: {resamples: 2000, seed: 20261106}
  tests:
    H2: one-sided (LR > 1) at the 5% level for H2a and H2b, Holm-corrected across the two
    H2c: two-sided at the 5% level
    H3: two-sided (ratio = 1) at the 5% level, on paired windows (same firm and start date)
    H4: one-sided (LR > 1) per signal, Holm correction across the eight H4 signals at 5%, test period only
    H4_benchmark: Brier score of M2 against the unit-weighted checklist and the base rate, test period, paired firm-cluster bootstrap
  models:
    - id: M1
      outcome: five-year end multiple on the six-bucket grid
      model: ordered logit with start-date fixed effects, errors clustered by firm
    - id: M2
      outcome: touch 10x within 5 years
      model: logit with start-date fixed effects, errors clustered by firm
  regressors: the H4 signals and the H2 cohort flag, each measured at the start date only; the floor also as net cash over market cap
  out_of_sample: >-
    Likelihood ratios and models are fitted on start dates up to 2016 and evaluated on
    2017 to 2021. Windows from the two periods overlap in calendar time, so the split
    tests stability across vintages, not real-time forecasting.
  robustness:
    - January formation dates only (the AEM-2 v2.6 year-end design)
    - market cap from US$300m (micro caps excluded, as in AEM-2 v2.6)
    - market cap from US$50m (micro-cap extension)
    - no minimum price (AEM-2 v2.6 runs the US$1 filter as its robustness check; here it is the primary)
    - delisting returns at the lower bound (total loss) and the upper bound (no haircut, the same as no delisting return)
    - Nasdaq performance delistings at -30% (the -55% estimate comes from CRSP's pre-1999 Nasdaq data)
    - insider classification on purchases only
    - drawdown relative to the universe median (H2)
  outputs_to_terminal: >-
    The measured five-year bucket shares replace the K1d placeholder (23 / 25 / 27 / 16 /
    6 / 3%), P(touch 10x within 5 years) replaces the 3% prior, and the test-period
    likelihood ratios are set against the asserted table (2.0 / 1.3 / 0.8 / 0.6).

coverage:
  # Decides whether a paid source with delisted tickers (EODHD) adds value.
  benchmark_years: [2013, 2026]
  benchmark_forms: ["25", "25/A", "25-NSE", "25-NSE/A"]
  match_window_days: 45
  attrition_horizon_years: 5
  attrition_start_years: [2013, 2015, 2017, 2019, 2021]
  # missing_share = share of the start universe that would be unpriced after delisting.
  # It is also the relative width of the base-rate bounds.
  eodhd_thresholds:
    not_needed_max_missing_share: 0.05
    optional_max_missing_share: 0.15

data_sources:
  simfin_cache_dirs: ["cvm-research/data/raw", "cvm-research/data"]   # relative to the Drive root
  stooq_bulk_page: "https://stooq.com/db/h/"
  sec_min_interval_seconds: 0.2
  sec_financial_statements: "https://www.sec.gov/files/dera/data/financial-statement-data-sets/{year}q{q}.zip"
  sec_insider_transactions: "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{year}q{q}_form345.zip"
  sec_form13f: "https://www.sec.gov/files/structureddata/data/form-13f-data-sets/"
  insider_history_start_year: 2009    # Cohen-Malloy-Pomorski needs three prior years of trades
