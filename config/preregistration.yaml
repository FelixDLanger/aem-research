# AEM base-rate study – pre-registration (DRAFT)
#
# How the lock works
#   * Everything below this comment block is hashed (SHA-256 of the parsed YAML,
#     canonical JSON). Comments and key order do not change the hash; any value does.
#   * Review and edit freely while status is "draft". When you are satisfied, set
#     study.status to "final" and lock (config/LOCK.json). The outcome engine
#     refuses to run until the lock exists and matches this file.
#   * Changing anything after the lock is an amendment: it needs a deliberate
#     re-lock with a note, and the previous lock stays in LOCK.json's history.
#   * review_before_lock lists the decisions still open. The lock refuses while the
#     list has entries: settle each one in the config, then delete it from the list.

study:
  id: aem-basestudy
  title: "Base rates for extreme multiples in US small caps, and the information content of AEM screening signals"
  version: "0.3"
  status: draft
  author: "Felix D. Langer"
  framework: "AEM-2 v2.6 (the screening terminal's default since Oct 25, 2026)"

decisions:
  # Settled with Felix on Nov 6, 2026 (Bangkok). Kept in the hashed record for the
  # paper's methods section.
  - id: D1
    topic: delisting returns
    decision: >-
      Checked against the sources: -30% for performance-related delistings on NYSE and
      NYSE American (Shumway 1997) and -55% on Nasdaq (Shumway and Warther 1999),
      applied only when the actual delisting return is unknown, which is always the
      case here. Mergers take 0%.
  - id: D2
    topic: sample start
    decision: >-
      First formation date January 2013, not 2003 (AEM-2 v2.6) or 2009 (draft 0.1).
      Smaller companies tagged XBRL financial statements only for periods ending on or
      after June 15, 2011, so trailing free cash flow, net cash and year-on-year growth
      are known from filings for every company size and fiscal-year pattern from
      January 2013. Earlier years are skipped rather than filled from other sources.
      All hypotheses use the same sample, so the prior and the likelihood ratios
      describe the same population.
  - id: D3
    topic: formation frequency
    status: proposed by Claude, confirmed by Felix on Nov 6, 2026
    decision: >-
      Quarterly formation dates (the first trading day of January, April, July and
      October) instead of year-end only. The AEM applies its prior on any date, so the
      base rate should average over the calendar, and a January-only screen mixes the
      turnaround cohort with the turn-of-year rebound of tax-loss losers. The January
      subset is reported as the like-for-like AEM-2 v2.6 year-end design.
  - id: D4
    topic: universe floor
    decision: Market cap from US$100m to US$2bn, as in AEM-2 v2.6.
  - id: D5
    topic: signals
    decision: >-
      H4 tests the AEM-2 v2.6 battery: an S1 proxy, S4 proxies (any purchase, a
      cluster, opportunistic insiders), the floor (net cash), positive free cash flow,
      low dilution and low attention. Analyst counts need I/B/E/S, which is paid, so
      attention is measured by institutional breadth from SEC Form 13F filings, with
      share turnover as the fallback.
  - id: D6
    topic: insider purchases
    decision: >-
      Both definitions, compared: any officer or director purchase (combined) and
      purchases by opportunistic insiders only (Cohen, Malloy and Pomorski 2012), with
      routine and unclassified insiders reported separately.
  - id: D7
    topic: macro regime
    status: proposed by Claude in answer to Felix's question on rates and inflation, confirmed by Felix on Nov 6, 2026
    decision: >-
      The 2022 split stays the primary regime definition. Six exploratory moderators,
      each measured at the start date, test the mechanisms behind it: the 10-year real
      yield (discount rate), the 12-month change in the 2-year yield (tightening), the
      Baa credit spread (refinancing and distress), CPI inflation, the universe's median
      drawdown (market stress) and its median free-cash-flow yield (starting valuation).
      The same regime variables feed Paper A.
  - id: D8
    topic: regime confirmation and yearly updates
    status: proposed by Claude, confirmed by Felix on Nov 6, 2026
    decision: >-
      The locked sample has complete windows after 2021 only at the 3-year horizon, from
      eight start dates in two calendar years, so H5 can find a regime difference but
      cannot confirm it. Each year, the start dates whose 3-year windows have completed
      since the lock are added (2024 in 2027, 2025 in 2028) as a pre-announced update:
      the same code, a re-lock noted "D8 update", the original lock kept in the history.
      A difference found in the locked sample is tested once, after the October 2025
      start date's window closes, one-sided in the direction found, on the 2024 and 2025
      start dates only – data nobody had seen at the lock, and an arm the same size as
      2022–2023. Until it passes, the terminal uses the pooled base rates and shows the
      regime rates beside them.
  - id: D9
    topic: unplanned findings
    status: Felix's principle (Nov 6, 2026); the rules below proposed by Claude
    decision: >-
      The lock fixes what is tested, not what may be learned. Patterns nobody specified
      are welcome – like the EAGI finding that governance leads to AI adoption – and are
      reported in their own section, labeled exploratory, with every analysis tried, so
      a reader can see how many looks produced them. A finding earns weight in the
      screening terminal once it holds on data it was not found in: exploration runs
      first on the fit period (start dates to 2016) and is confirmed once on 2017-2021;
      a finding that needs the whole sample is confirmed on the start dates added under
      D8. Until then the terminal shows it as a provisional flag with its in-sample
      estimate, logged and Brier-scored in the decision log, with no weight in the
      posterior: newly discovered effects are inflated on average (Ioannidis 2008), and
      an inflated likelihood ratio oversizes the bet.
  - id: D10
    topic: price basis
    status: proposed by Claude, confirmed by Felix on Nov 8, 2026 (option A primary, option B the robustness check)
    decision: >-
      The first run found about a fifth of the companies in range at the median start
      date (a third in 2013) missing from SimFin and Stooq – mostly companies that later
      delisted – and EODHD's personal plans do not cover publishing results. So every
      price the primary analysis uses now comes from SEC filings (price_basis): quarter-end
      prices from Form 13F, the SEC fails-to-deliver files where 13F has none, and splits
      found from the holders' share counts and CUSIP changes. Entry, the size and price
      filters, the 3-year drawdown and the outcomes use these prices for every company
      alike, so the companies added back – the ones that later vanished – are measured
      exactly like the survivors, and the published numbers rest on public data only. A
      touch is a quarter-end close at or above the multiple (or the last price before a
      series stops); brief spikes between quarter-ends do not count, so touch rates come
      out lower than on daily closes, and the ratio between the two is measured on
      2009-2012 start dates, outside the sample. Robustness B keeps the daily vendor closes
      and fills only the companies the vendors never priced. Decided before any outcome
      was computed.

review_before_lock:
  - >-
    Run Phase F of the notebook once (counts only, no returns) and check that each
    feature is known for at least 80% of universe windows from its first formation
    date, and that fewer than 25% of ended series fall into the "unknown" delisting
    class. Review the power table (smallest detectable likelihood ratio per cohort). For
    the SEC price panel (D10): quarterly returns agree with the vendors' split-adjusted
    prices within 10% for at least 95% of company-quarters, split detection reaches 90%
    precision and recall against the splits the vendors' adjustments imply (as defined
    in price_basis.validation), and the panel prices at least 80% of the vendor panel's
    holes that are exchange-listed. Universe A must be of the same order as the vendor
    universe on the same dates (the FUNNEL A and A VS V lines show each filter's share).
    If a check fails, fix the definition here before locking.

hypotheses:
  - id: H1
    tier: primary
    type: descriptive
    statement: >-
      Base rates. The probability that a US small cap's price touches m times its
      entry price within T years, for m in {3, 10} and T in {3, 5}, and the
      distribution of five-year end multiples on the six-bucket grid with its mean.
      Reported pooled, by start year, and by regime (start dates before 2022 versus
      2022 and later).
  - id: H2
    tier: primary
    type: confirmatory
    statement: >-
      Fallen-quality cohort (the terminal's turnaround lane). Stocks at least 40% below
      their 3-year high, with positive trailing-twelve-month free cash flow, net cash,
      and an open-market purchase (Form 4 code P) by an officer or director filed in
      the prior 6 months touch 3x within 3 years more often than the unconditional
      base rate (likelihood ratio > 1).
    variants:
      H2a: any officer or director purchase (the combined definition)
      H2b: purchases by opportunistic insiders only (Cohen, Malloy and Pomorski 2012)
    comparison: >-
      H2c (secondary). Within the cohort, windows with an opportunistic purchase versus
      windows with routine purchases only: the difference in 3x touch rates and in
      likelihood ratios, with 95% intervals. Unclassified insiders are reported as a
      third group. This shows whether separating insider types adds information beyond
      the combined definition.
    ablation: >-
      Drop each cohort condition in turn and report each condition's marginal
      likelihood ratio, to show which condition carries the information.
    placebo: >-
      The same cohort with an officer or director open-market sale and no purchase in
      place of the purchase. A likelihood ratio above 1 there would mean fallen quality,
      not the insider's information, drives H2.
    if_null: >-
      The terminal keeps scoring turnarounds on the Matrix's three-year horizon, but an
      insider purchase earns no extra weight in the turnaround lane.
  - id: H3
    tier: secondary
    type: confirmatory
    statement: >-
      Horizon conversion. P(touch >= 3x within 3 years) equals P(touch >= 6.24x within
      5 years), where 6.24 = 3^(5/3) is the AEM Matrix's annualized-rate mapping.
      The mapping is rejected if the ratio of the two probabilities differs from 1 at
      the 5% level.
    if_null: The Matrix keeps the 6.24 mapping for three-year claims.
    if_rejected: The Matrix replaces 6.24 with the measured equivalent multiple.
  - id: H4
    tier: secondary
    type: confirmatory
    statement: >-
      Signal likelihood ratios. Each AEM-2 v2.6 signal proxy carries a likelihood ratio
      above 1 for touching 10x within 5 years, out of sample (fit on start dates up to
      2016, test on 2017 to 2021): S1 (free cash flow per share outgrew revenue), S4
      any (an officer or director purchase), S4 cluster (two or more insiders), S4
      opportunistic, floor (net cash), positive free cash flow, low dilution, and low
      attention.
    benchmark: >-
      Out of sample, the fitted 10x model (M2) is compared with a unit-weighted
      checklist of the same signals and with the base rate alone, by Brier score. If M2
      does not beat the checklist, the checklist is what the terminal uses.
    if_null: >-
      A signal whose likelihood ratio is not above 1 out of sample keeps no weight in the
      AEM-2 posterior; the asserted table (2.0 / 1.3 / 0.8 / 0.6) is replaced by the
      measured ratios, including the nulls.
  - id: H5
    tier: exploratory
    type: exploratory
    statement: >-
      Regime. Base rates and likelihood ratios differ between start dates before 2022
      and 2022 or later (the primary split; complete windows after 2021 exist only at the
      3-year horizon). Exploratory moderators, each measured at the start date (see
      regime): the 10-year real yield, the 12-month change in the 2-year yield, the Baa
      credit spread, CPI inflation, the universe's median drawdown and its median
      free-cash-flow yield. Macro variables vary only across start dates, so inference
      resamples calendar years, not firms. Low power by construction; reported as
      exploratory only. A difference found here is a hypothesis, which D8 tests once on
      start dates added after the lock.
  - id: H6
    tier: exploratory
    type: exploratory
    statement: >-
      Post-results clusters. Two or more officer or director purchases within 14 days
      after a 10-Q or 10-K filing (the AEM-2 v2.6 S4 flag; the filing date stands in for
      the results date) carry a higher likelihood ratio for touching 3x within 3 years
      than other purchases.

regime:
  primary_split: start dates before 2022 versus 2022 and later
  moderators:
    real_yield_10y: {source: FRED DFII10, rule: last daily value before the start date}
    tightening_2y_12m: {source: FRED DGS2, rule: 2-year yield change over the 12 months before the start date}
    credit_spread_baa: {source: FRED BAA10Y, rule: last daily value before the start date}
    # CPIAUCNS: BLS publishes the unadjusted CPI-U as final when issued, on the 1982-84
    # base throughout the sample, so no vintages and no splice are needed. The market
    # series (DFII10, DGS2, BAA10Y) are observed on the day. BAA10Y is Moody's
    # copyrighted data: it stays on Drive and is never committed.
    inflation_cpi_yoy: {source: FRED CPIAUCNS, rule: 12-month change of the index two months before the start month, the latest release on the start date}
    market_stress: universe median drawdown from the 3-year high on the start date
    valuation_fcf_yield: universe median trailing free cash flow over market cap on the start date
  mechanisms: >-
    Ten-baggers are long-duration bets, so lower real rates lift them most. Small caps
    fund with equity and floating-rate debt, so tightening raises dilution, distress and
    delistings, which should favor the net-cash, cash-generating fallen-quality cohort.
    Starting valuation and market stress set how much rebound is available.
  inference: year-block bootstrap (the four start dates of a calendar year resampled together)
  update:
    cadence: yearly, as 3-year windows complete (D8)
    adds: start dates whose 3-year windows have completed since the lock (2024 in 2027, 2025 in 2028)
    confirmation: >-
      once, after the October 2025 start date's 3-year window closes (November 2028),
      one-sided at 5% in the direction found in the locked sample, on the 2024 and 2025
      start dates only, with year-block intervals
    terminal: pooled base rates until the confirmation passes; regime rates shown beside them

analysis_hierarchy: >-
  H1 and H2 (H2a and H2b, Holm-corrected) are primary and are the only results that
  may be stated as findings. H2c, H3 and H4 are secondary and are reported as
  supporting evidence. H5 and H6 are exploratory and are reported as hypotheses for
  future work. Unplanned findings (D9) are reported as exploratory; one that holds on
  data it was not found in is reported as a replicated exploratory finding and may
  inform the terminal.

exploration:
  # D9: the lock fixes what is tested, not what may be learned.
  report: a separate section, labeled exploratory, listing every analysis tried
  discovery: start dates up to 2016 (the fit period) first, wherever the question allows
  confirmation: >-
    once on 2017-2021 for findings made in the fit period; on the start dates added
    under D8 for findings that need the whole sample
  terminal: >-
    confirmed findings enter with their measured weight; unconfirmed ones are shown as
    provisional flags, logged and Brier-scored in the decision log, with no weight in
    the posterior
  log: every exploratory analysis is written to output/exploration_log.csv with its date, sample and result, so the number of looks is on record

universe:
  country: US
  exchanges: [NYSE, NASDAQ, NYSE American]
  security_type: common stock
  filer: >-
    Files 10-K and 10-Q reports with XBRL financial statements (SEC Financial Statement
    Data Sets), with one filed within current_filer_months before the formation date.
  exclude: [ETF, closed-end fund, pre-merger SPAC shell (SIC 6770), ADR and other foreign private issuers (20-F or 40-F filers)]
  min_price_usd: 1.0
  market_cap_usd: {min: 100000000, max: 2000000000}     # AEM-2 v2.6
  market_cap: >-
    Unadjusted entry price times shares outstanding from the latest cover page filed
    before the formation date (dei:EntityCommonStockSharesOutstanding, summed across
    classes); SimFin shares where no filing value exists.
  unadjusted_price: >-
    Vendor price histories are rescaled for every later split, so size and price filters
    on them would use the future (a later 1:10 reverse split shows ten times the actual
    price). The unadjusted entry price is the vendor's adjusted price times the ratio of
    the 13F implied price (market value over shares held, median of at least three
    filers) to the vendor's price at the latest usable quarter-end; without 13F holders,
    the vendor's own close. The minimum price uses the same basis.
  min_median_dollar_volume_20d_usd: 100000
  current_filer_months: 15

starts:
  frequency: quarterly
  months: [1, 4, 7, 10]        # formation on the first trading day of each
  years: [2013, 2023]          # inclusive; windows that end after the data's as-of date are censored
  entry_tolerance_days: 7      # entry = first close on or after the start date, within this many days
  annual_subset_month: 1       # January formations reproduce the AEM-2 v2.6 year-end design

price_panel:
  sources: >-
    The vendor panel, the basis of robustness B (D10): SimFin cache first; Stooq for
    symbols SimFin lacks. One source per symbol, never mixed inside a series. EODHD can
    still fill delisted names for private checks (the notebook's optional step), but its
    data are not used for published results: its personal plans do not cover publication.
  as_of: >-
    The earliest of the sources' last dates, so a source that ends sooner never looks
    like a wave of delistings.

price_basis:
  # D10 (Nov 8, 2026): A is primary, B is the robustness check. Code: aem_research.secprices,
  # aem_research.splits, aem_research.data.ftd.
  primary: >-
    A – the SEC price panel. One series per company (CIK): at each quarter-end the median
    of market value over shares held across the Form 13F filers of the company's main
    CUSIP (the one most filers hold, kept while it has at least a quarter of the leader's
    filers), at least three filers; where 13F has none (before the 13F data sets begin in
    2013, or a thin quarter), the closing price in the SEC fails-to-deliver files dated
    nearest the quarter-end, within 10 days, of the main CUSIP or an older CUSIP trading
    under its symbol. Every price is restated in the units after the series' last split.
    When a series stops before the as-of date, the last fails-to-deliver price within the
    following quarter is its final price (if at most three times the last quarter-end
    price). Quarter-end prices are dated the day after the quarter-end, the start date
    they serve; the close was public on its day, 13F only measures it later.
  splits: >-
    A split multiplies every holder's share count by the same ratio. Between consecutive
    quarter-ends the ten largest 13F holders of the main CUSIP present in both are
    matched; a split is recorded when at least three are matched, their median share
    ratio is within 3% of a standard ratio (those companies use: 6:5 to 100:1 forward,
    1:2 to 1:1000 reverse), at least half of them are within 5% of it, the ratio is
    at least 1.2 or at most 1/1.2, and the price moved with it (the split-adjusted
    quarterly move within 1/6 to 6 times; a share-class flip moves no price).
    Fails-to-deliver prices between two 13F quarters that straddle a split are dropped.
    At a change of main CUSIP without holder evidence, the last daily price under the
    old CUSIP over the first under the new one (at most 30 days apart) gives the ratio
    (within 6% of a standard ratio); the cover-page share counts in the filings
    (dei:EntityCommonStockSharesOutstanding, counted on or before the earlier
    quarter-end and after the later one) must agree within 35%, and without filings the
    ratio must be a common one (2:1 to 10:1 forward, 1:2 to 1:100 reverse; the full
    standard set is so dense below 1:10 that any price ratio lands near one of its
    members). Where neither prices nor holders decide, the filings alone record a split
    when their share ratio is within 8% of a standard ratio of at least 2:1 either way
    and the price moved the other way by about as much (split-adjusted move within
    1/2.5 to 2.5 times). Any quarter-to-quarter move of 2.5 times or more is checked the
    same way – one or two matched holders within 3% of a standard ratio, or the
    filings – and counted when nothing explains it. A one-quarter price error (at
    least 4 times away from both neighbouring quarter-ends, which agree within 50%) is
    replaced by the fails-to-deliver close of that quarter-end when it fits the
    neighbours, else left out.
  new_series: >-
    A change of main CUSIP that holders show to be the same security (median ratio within
    15% of 1) or prices show to be the same (within 25%) continues the series; one that is
    neither a split nor the same security starts a new series, and so does a gap of more
    than 200 days (two missing quarters): old equity cancelled in a reorganization is not
    the new equity.
  as_of: >-
    The last quarter-end whose 13F coverage (CUSIPs priced by at least three filers)
    reaches 90% of the median of the four quarters before it, plus one day.
  first_formation_date: "2013-07"   # A: the first start date with usable 13F holdings; A's liquidity screen needs them
  liquidity: >-
    SEC data have no daily volume, so A replaces the median 20-day dollar volume screen
    with a minimum number of 13F holders at the latest usable quarter (the breadth rule of
    features.attention): the threshold k with the highest Youden's J against the
    dollar-volume screen on the vendor panel's windows that pass every other filter
    (smallest k on ties, never below 3). Fixed from counts before the lock.
  listing: >-
    A company counts as exchange-listed at a start date when a vendor series prices it
    then (SimFin and Stooq hold exchange-listed stocks), an exchange files Form 25 for it
    later (it was listed until then), or a symbol the SEC files tie to it is in an
    exchange folder of the Stooq file.
  drawdown: 3-year high and drawdown from the panel's quarter-end prices (12 quarter-ends and the entry)
  delistings: >-
    A series that stops before the as-of date is classified by the delisting rules on
    its last price of the day (US$1 test) and its split-adjusted prices (collapse test);
    the delisting return applies to its last price.
  robustness_b: >-
    B – daily closes from the vendor panel (price_panel) with the vendor universe, plus
    the companies the vendor panel never prices, from the SEC panel with A's filters,
    measured on quarter-end prices plus the highest fails-to-deliver price of each
    half-month file (restated for splits; quarters with a split skipped). Start dates
    from January 2013 for vendor windows, from July 2013 for filled ones.
  validation: >-
    Before the lock and without outcomes: quarterly returns of the SEC panel against the
    vendors' split-adjusted prices for the same company and quarter (agreement within
    10%), and splits found against the splits the vendors' adjustments imply: the vendor
    return over the 13F price ratio within 5% of a common ratio, one-quarter round trips
    (a gap the next quarter undoes) excluded as price errors. Recall: the vendor's splits
    found with the vendor's ratio (within 10%); precision: splits found that the vendor's
    prices moved by. Also counted: quarters where the SEC return is at least twice or at
    most half the vendor's, and splits found where the vendor shows none. Thresholds in
    review_before_lock.
  calibration: >-
    The ratio of quarter-end to daily touch rates on the vendor panel, for windows that
    start on the quarterly dates of 2009-2012 (before the sample, so no sample window is
    computed): vendor tickers priced at US$1 or more with market cap US$100m-2bn (vendor
    close times the cover-page share count filed within 15 months, else the vendor's
    share count) and median 20-day dollar volume of at least US$100k. Only the ratios
    are shown. They translate the study's quarter-end touch rates into daily ones for
    the terminal.

outcomes:
  horizons_years: [3, 5, 10]
  touch_multiples: [2, 3, 4, 6.24, 10, 100]
  touch_basis: >-
    A (primary, D10): quarter-end closes of the SEC price panel, plus a series' final
    price. B (robustness): daily closes on the vendor panel series (SimFin adjusted close,
    else close; Stooq close), never intraday highs; filled companies as in
    price_basis.robustness_b.
  end_basis: adjusted close where available, else close
  stale_gap_days: 30           # a series that stops more than this before the window end has ended
  max_gap_days: 120            # a gap this long inside a series ends it (symbol reuse, relisting)
  sec_max_gap_days: 200        # the SEC panel: one missing quarter does not end a series, two do
  censoring: exclude windows that end after the data as-of date
  # Six-bucket grid from AEM-2 v2.5. Edges are geometric midpoints between grid
  # values; each bucket includes its lower edge.
  bucket_edges: [0.2, 0.632, 1.58, 3.54, 7.07]
  bucket_labels: [0.1, 0.4, 1.0, 2.5, 5.0, 10.0]

delisting:
  # Returns applied to the last observed price when a series ends inside a window.
  returns:
    merger: 0.0
    performance_nyse_amex: -0.30
    performance_nasdaq: -0.55
    performance: -0.30           # performance-related, exchange unknown
    unknown: -0.30
  sources: >-
    Shumway, T. (1997). The delisting bias in CRSP data. Journal of Finance, 52(1),
    327-340. Shumway, T., and Warther, V. A. (1999). The delisting bias in CRSP's
    Nasdaq data and its implications for the size effect. Journal of Finance, 54(6),
    2361-2379; its abstract: "a corrected return of -55 percent for missing
    performance-related delisting returns corrects the bias". The 1997 full text was
    not reachable, so the -30% NYSE/AMEX figure is checked against Alquist, R., Israel,
    R., and Moskowitz, T. (2018). Fact, fiction, and the size effect. Journal of
    Portfolio Management, 45(1), note 6. Imputing only when the delisting return is
    missing is the standard implementation (SAFE data center, CRSP data description).
  classification:
    merger: >-
      A merger filing about the issuer (DEFM14A, DEFM14C, PREM14A, PREM14C, SC 14D9,
      SC TO-T, SC 13E3 or 425) in the 365 days before its last trading day or the 30
      days after.
    performance: >-
      No merger evidence, and the last close is below US$1, or at most half the close a
      year earlier, or the exchange filed Form 25-NSE.
    exchange: >-
      The exchange that filed Form 25-NSE near the last trading day (the index lists the
      exchange's row of the same accession), else the issuer's latest exchange-filed
      Form 25 before it, else the listing folder in the Stooq file, else the EODHD
      symbol lists. NYSE and NYSE American (formerly NYSE MKT and AMEX) take
      performance_nyse_amex, Nasdaq takes performance_nasdaq, an unknown exchange takes
      performance.
    unknown: Neither kind of evidence.
  bounds: >-
    Every imputed delisting is also reported with a lower bound (total loss of the last
    price) and an upper bound (no haircut on the last price).

turnaround_cohort:
  name: fallen quality (the terminal's turnaround lane)
  drawdown_from_high: -0.40
  drawdown_lookback_years: 3
  drawdown_variants: [absolute, relative_to_market]   # absolute is primary; relative subtracts the universe median drawdown on the same date
  ttm_free_cash_flow_positive: true
  net_cash_positive: true
  insider_purchase:
    form: "4"
    transaction_code: P
    acquired_disposed: A
    roles: [officer, director]
    lookback_months: 6
    availability: Form 4 filing date
    exclude_rule_10b5_1: true        # where the filing carries the Rule 10b5-1 flag
    cluster_variant_min_insiders: 2
    classification:
      method: Cohen, Malloy and Pomorski (2012), Journal of Finance, 67(3), 1009-1043
      routine: >-
        Traded (open-market purchases and sales pooled) in the same calendar month in
        each of the three calendar years before the formation year.
      opportunistic: Traded in each of those three years, but not routine.
      unclassified: Fewer than three consecutive years of trades.
      unit: insider and issuer pair, classified on January 1 from trades filed before it
      robustness: purchases only

features:
  availability: >-
    Each value is used only from the date it became public: a financial value from its
    10-K or 10-Q filing date, an insider trade from its Form 4 filing date, a 13F
    holding from its 13F filing date. The look-ahead guard fails the run otherwise.
  first_formation_date: {H1: "2013-01", H2: "2013-01", H4: "2013-07"}   # H4 waits for 13F breadth (XML filings from May 2013)
  ttm: >-
    Flows (operating cash flow, capital expenditure, revenue): the annual value at the
    latest period, or the prior fiscal year plus the current year-to-date less the
    prior year-to-date, using for each period the latest value filed before the
    formation date.
  free_cash_flow: >-
    NetCashProvidedByUsedInOperatingActivities less
    PaymentsToAcquirePropertyPlantAndEquipment (fallback tags in the code). Missing
    capital expenditure counts as zero and is flagged.
  net_cash: cash and equivalents plus short-term investments less debt, at the latest balance-sheet date
  dilution: >-
    Change in weighted-average diluted shares against the same period a year earlier;
    where that pair is missing, the cover-page shares outstanding of the filings known
    on the start date and a year before it (same basis both years; amended before the
    lock, Nov 8, 2026, after the first run found S1 known for 73.2% of windows); low
    dilution means below 2%.
  s1_proxy: >-
    free cash flow per share positive now and a year earlier, and growing faster than
    revenue; shares as in dilution
  missing: >-
    H2 and H4 use the windows whose inputs are all known at the start date; the share
    left out is reported. A company with no Form 4 purchase on file counts as having
    none (insiders must file), not as unknown.
  attention:
    primary: >-
      Institutional breadth: the number of 13F filers with a share position in the
      stock for the latest quarter, counting filings filed before the formation date.
    fallback: turnover – median daily volume over shares outstanding, prior 126 trading days
    low: bottom tercile of the measure net of log market cap, per formation date
    cusip_bridge: >-
      SimFin ISIN (a US ISIN carries the CUSIP), then the issuer CUSIP, then the ticker in
      the SEC fails-to-deliver files matched to the SEC symbol bridges over overlapping
      dates (D10), then the normalized issuer name
    rule: >-
      Breadth is the H4 attention signal if it is known for at least 80% of H4
      windows; otherwise turnover is, and breadth is reported as exploratory. Decided
      on counts before the lock.
  post_results_window_days: 14   # H6

estimation:
  # How each hypothesis is tested, fixed before any outcome is seen. Follows the AEM-2
  # v2.6 calibration test battery: an ordered logit on the six buckets, a 10x logit,
  # start-date fixed effects, firm-clustered errors, an out-of-sample split, robustness.
  unit: one window per firm, formation date and horizon
  likelihood_ratio: >-
    LR = P(signal | hit) / P(signal | miss), the factor the AEM posterior applies to the
    prior odds. LR > 1 says the same as a hit rate above the base rate.
  intervals: >-
    95% intervals from a firm-cluster bootstrap: all of a firm's windows are resampled
    together, because one firm appears in several overlapping start dates. Pooled H1
    rates are also shown with start years resampled (blocks of four quarterly dates),
    which reflects market-wide shocks.
  bootstrap: {resamples: 2000, seed: 20261106}
  tests:
    H2: one-sided (LR > 1) at the 5% level for H2a and H2b, Holm-corrected across the two
    H2c: two-sided at the 5% level
    H3: two-sided (ratio = 1) at the 5% level, on paired windows (same firm and start date)
    H4: one-sided (LR > 1) per signal, Holm correction across the eight H4 signals at 5%, test period only
    H4_benchmark: Brier score of M2 against the unit-weighted checklist and the base rate, test period, paired firm-cluster bootstrap
  models:
    - id: M1
      outcome: five-year end multiple on the six-bucket grid
      model: ordered logit with start-date fixed effects, errors clustered by firm
    - id: M2
      outcome: touch 10x within 5 years
      model: logit with start-date fixed effects, errors clustered by firm
  regressors: the H4 signals and the H2 cohort flag, each measured at the start date only; the floor also as net cash over market cap
  out_of_sample: >-
    Likelihood ratios and models are fitted on start dates up to 2016 and evaluated on
    2017 to 2021. Windows from the two periods overlap in calendar time, so the split
    tests stability across vintages, not real-time forecasting.
  robustness:
    - January formation dates only (the AEM-2 v2.6 year-end design)
    - market cap from US$300m (micro caps excluded, as in AEM-2 v2.6)
    - market cap from US$50m (micro-cap extension)
    - no minimum price (AEM-2 v2.6 runs the US$1 filter as its robustness check; here it is the primary)
    - delisting returns at the lower bound (total loss) and the upper bound (no haircut, the same as no delisting return)
    - Nasdaq performance delistings at -30% (the -55% estimate comes from CRSP's pre-1999 Nasdaq data)
    - insider classification on purchases only
    - drawdown relative to the universe median (H2)
    - without the April and July 2020 start dates, formed at the COVID trough (as AEM-2 v2.6 flags the 2009 trough)
    - multiples in real terms (the touch threshold rises with CPI from entry)
    - insider-sale placebo for H2 (see H2 placebo)
    - B, the daily vendor closes with the SEC fill (D10, price_basis.robustness_b)
    - H2 on start dates from 2016 only, where the 3-year drawdown rests on 13F quarter-ends throughout
    - likelihood-ratio intervals with start years resampled as well as firms, because shocks such as 2020-2021 hit many firms at once
  descriptives:
    - the calendar year of each first 3x and 10x touch, to show how much of a base rate comes from one episode such as 2020-2021
    - delisting classes (merger, performance, unknown) by start year and regime, since tightening should raise performance delistings
  outputs_to_terminal: >-
    The measured five-year bucket shares replace the K1d placeholder (23 / 25 / 27 / 16 /
    6 / 3%), P(touch 10x within 5 years) replaces the 3% prior, and the test-period
    likelihood ratios are set against the asserted table (2.0 / 1.3 / 0.8 / 0.6).
    Regime-specific rates replace the pooled ones only after the D8 confirmation.
    Unplanned findings reach the terminal under D9: provisional flags until confirmed.

coverage:
  # Decides whether a paid source with delisted tickers (EODHD) adds value.
  benchmark_years: [2013, 2026]
  benchmark_forms: ["25", "25/A", "25-NSE", "25-NSE/A"]
  match_window_days: 45
  attrition_horizon_years: 5
  attrition_start_years: [2013, 2015, 2017, 2019, 2021]
  # missing_share = share of the start universe that would be unpriced after delisting.
  # It is also the relative width of the base-rate bounds.
  eodhd_thresholds:
    not_needed_max_missing_share: 0.05
    optional_max_missing_share: 0.15

data_sources:
  simfin_cache_dirs: ["cvm-research/data/raw", "cvm-research/data"]   # relative to the Drive root
  stooq_bulk_page: "https://stooq.com/db/h/"
  sec_min_interval_seconds: 0.2
  fred_csv: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"   # no key needed
  sec_financial_statements: "https://www.sec.gov/files/dera/data/financial-statement-data-sets/{year}q{q}.zip"
  sec_insider_transactions: "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{year}q{q}_form345.zip"
  sec_form13f: "https://www.sec.gov/files/structureddata/data/form-13f-data-sets/"
  insider_history_start_year: 2009    # Cohen-Malloy-Pomorski needs three prior years of trades
  sec_fails_to_deliver: "https://www.sec.gov/data/foiadocsfailsdatahtm"   # half-month zips, all securities with fails from Sep 16, 2008
  sec_fails_start: "200907a"          # 3-year lookbacks for 2013 start dates need 2010 prices
  eodhd:
    secret: EODHD_API_KEY            # Colab secret; never in code or output
    plan: EOD Historical Data – All World, one month
    use: optional, private checks only (D10) – end-of-day history of listed and delisted US common stocks SimFin lacks
    licence: >-
      personal plans cover private research and keeping downloaded data; publication is
      a separate use case – confirm with EODHD before Paper B is published
