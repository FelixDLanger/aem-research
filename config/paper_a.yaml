# Paper A – regime-conditional value creation in US take-private buyouts (draft).
# Hashed like the Paper B config; config/paper_a_LOCK.json locks it. Notebook 02 reads it.
# Until the lock, the notebook reports counts and entry-side data only (A2).

study:
  name: Regime-conditional value creation in US take-private buyouts
  short_name: Paper A
  version: "0.1"
  status: draft
  author: Felix D. Langer (ORCID 0009-0000-3205-8088)
  shares_with: >-
    config/preregistration.yaml (Paper B) – the regime moderators (D7), the EDGAR caches
    and the XBRL engine
  method_reference: >-
    Guo, Hotchkiss and Song (2011), Do Buyouts (Still) Create Value?, Journal of
    Finance 66(2), 479-517 – public-to-private buyouts identified and measured from SEC
    filings

decisions:
  - id: A1
    topic: data sources
    status: agreed by Felix on Nov 6, 2026
    decision: >-
      The core sample comes from SEC filings, so every number is public and replicable.
      PCRI's deal-level database checks scale (holding periods and exit routes by
      vintage); WSIB's quarterly fund table gives net returns by vintage. Data cost:
      zero.
  - id: A2
    topic: blinding
    status: proposed by Claude on Nov 6, 2026 (the Paper B rule)
    decision: >-
      Until this file is locked, notebook 02 shows counts and entry-side data only. Exit
      values, value-creation components and fund returns are not computed or shown; the
      raw inputs (WSIB tables included) are cached for after the lock.
  - id: A3
    topic: unplanned findings
    status: Paper B's D9 applies unchanged
    decision: >-
      Surprises are welcome, reported as exploratory with every analysis tried, and
      confirmed on data they were not found in before they are stated as findings.

  - id: A4
    topic: sponsor deals and the comparison group
    status: decided by Felix on Nov 10, 2026
    decision: >-
      The search finds every buyer that used an equity commitment letter. Deals with a
      sponsor (named, or private equity wording near the buyer) are the core sample;
      deals with a strategic or unclear buyer stay in as a flagged comparison group;
      SPAC mergers are not take-privates and are excluded.

review_before_lock:
  - >-
    Run notebook 02 once (counts only) and check, by announcement year, how many deals
    have entry financials, an offer price and a visible exit; then fix the sample rules
    below.
  - >-
    Check the extracted terms as the validation section says: 30 deals drawn by a fixed
    seed, read against the passages they came from, and a second filing for every deal.
    Each term has its own gate (validation.term_gates): 90% correct or it is not used.
    The offer price and the buyer type, which the hypotheses need, have passed.
  - >-
    Agree the hypotheses below with Felix (drafted by Claude on Nov 6, 2026), then set
    study.status to final.

hypotheses:
  - id: A-H1
    tier: draft
    statement: >-
      For take-privates entered before 2022, multiple expansion accounts for a larger
      share of equity value creation than for deals entered in 2022 or later.
  - id: A-H2
    tier: draft
    statement: >-
      Deal-level multiple change tracks the public small-cap benchmark's multiple change
      between entry and exit; the remainder is the deal-specific part.
  - id: A-H3
    tier: draft
    statement: >-
      Holding periods lengthen and re-IPO exits become rarer for exits after 2021.

sample:
  announce_years: [2012, 2026]
  search:
    query: '"equity commitment letter" OR "equity commitment letters"'
    forms: [DEFM14A, DEFM14C, PREM14A, PREM14C, SC 14D9, SC 13E3]
    why: a sponsor's equity commitment marks sponsor-backed deals; strategic buyers rarely need one
  deal_gap_months: 18
  completion_window_months: 18
  current_filer_months: 15
  value_bridge_excludes_sic: [6000, 6799]     # banks, insurers, REITs: EBITDA is not meaningful
  buyer_types:                                # decision A4
    sponsor: a listed sponsor named with an affiliation cue (affiliate of, formed by, managed by, led by …)
    sponsor_not_on_the_list: private equity wording within 200 characters after the buyer's name, at least twice
    private_equity_cues: 2
    strategic_or_unclear: neither – the flagged comparison group
    spac_merger: SIC 6770 or at least this many mentions of a trust account – excluded
    spac_trust_account_mentions: 5

validation:
  decided: by Felix on Nov 10, 2026 (the check runs in the notebook; Claude reads the 30, Felix the disagreements)
  reading_sample:
    n: 30
    seed: 20261112
    development_seeds: [20261110, 20261111]
    # read on Nov 10 (seed 20261110): price 97%, equity 76%, debt 42%, sponsor 61%
    # read on Nov 11 (seed 20261111): price 100%, sponsor 89%, equity 71%, debt 72%, buyer type 30 of 30
    # the extractors were rebuilt on both, so a fresh sample confirms
    draw: >-
      completed deals whose document was read, ordered by SHA-256 of "seed:deal_id";
      the first 30. Each is shown with every extracted value and the passage it came from.
    target: 90% of the read values correct
  term_gates:
    decided: by Felix on Nov 11, 2026 (precision first; the lock must not wait for the commitments)
    rule: >-
      A term is used only if at least 90% of its read values were correct in the latest
      fresh reading sample. A term that misses is reported as not validated and used
      nowhere; it does not hold up the lock. Commitments are taken only from a sentence
      that states them (precision first) and are otherwise unknown.
    needed_for_the_hypotheses: [offer price, buyer type]
    descriptive_only: [sponsor name, equity commitment, debt commitment]
    offer_price: passed (28 of 29 and 30 of 30)
    buyer_type: passed (30 of 30 on Nov 11)
    sponsor_name: open (16 of 18 on Nov 11)
    equity_commitment: open
    debt_commitment: open
  second_source:
    what: >-
      the target's own 8-K within the window around the first merger filing that names
      the merger agreement and a per-share price (press release before the 8-K before
      the agreement exhibit; the earliest such filing), else another target-side merger
      filing of the deal; never the filing the terms were read from
    days_before: 150
    days_after: 30
  price_tolerance: 0.005        # offer prices agree within 0.5%
  value_tolerance: 0.15         # stated deal value within 15% of the computed equity or enterprise value
  commitment_tolerance: 0.01    # commitments, compared only against another merger filing

entry:
  date: the first target-side merger filing (proxy, information statement, 14D-9 or 13E-3)
  financials: the latest 10-K or 10-Q filed before that date (XBRL, point in time)
  ebitda: >-
    trailing operating income plus depreciation and amortization; amortization of
    intangibles added when only depreciation is tagged; pre-tax income plus interest
    as the fallback
  enterprise_value: offer price × cover-page shares + debt − cash; unknown where the filing tags no debt at all
  leverage: largest debt amount committed / entry EBITDA (approximate, hand-checked)

exits:
  routes:
    - still files 10-Ks or 10-Qs more than 90 days after completion (registered debt) – post-buyout financials
    - re-IPO – an S-1 or 424B filing more than 180 days after completion under a matching name
    - sold to a listed buyer – an 8-K "completion of acquisition" naming the target, more than 180 days after completion
    - not visible
  still_files_days: 90
  exit_days: 180
  values: computed only after the lock (A2)

benchmark:
  public: median EV/EBITDA and EV/revenue of the Paper B universe (US$100m–2bn) at each quarterly start date

regime:
  moderators: Paper B D7 (real yield, 2-year tightening, Baa spread, CPI inflation), measured at entry and at exit
  primary_split: entry before 2022 vs 2022 or later

wsib:
  first_year: 2016
  url: https://www.sib.wa.gov/docs/reports/quarterly/ir{mmddyy}.pdf
  strategies_of_interest: [Corporate Finance/Buyout]
  outcome_columns_hidden_until_lock: [market_value, distributed, total_value, multiple_printed, gain, net_irr, tvpi]

pcri:
  status: >-
    application to draft – a 2-3 page proposal; analysis in NORC's remote enclave, with
    aggregated output of at least 100 observations
